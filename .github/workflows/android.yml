name: Build Android Release

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Production Release (AAB + APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Install Android SDK Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Production AAB Bundle & APK with Gradle
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SSHMobile-GooglePlay-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SSHMobile-Release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
