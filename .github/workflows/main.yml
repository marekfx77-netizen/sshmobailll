name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true
          xcodebuild -version

      - name: Trust Xcode Plugins and Macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Install iOS 18 Platform
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 18.0 || xcodebuild -downloadPlatform iOS || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          elif [ -f "SSHMobile/project.yml" ]; then
            cd SSHMobile && xcodegen generate && cd ..
          else
            echo "Searching for project.yml..."
            PROJECT_DIR=$(find . -name "project.yml" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR" && xcodegen generate && cd -
          fi

      - name: Inspect Project and Resolve Packages
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found project: $PROJ_FILE"
          xcodebuild -project "$PROJ_FILE" -list
          xcodebuild -project "$PROJ_FILE" -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation

      - name: Build Archive (Unsigned)
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found project: $PROJ_FILE"
          xcodebuild archive \
            -project "$PROJ_FILE" \
            -scheme SSHMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/SSHMobile.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build/SSHMobile.xcarchive/Products/Applications/ -name "*.app" | head -n 1)
          echo "Found App: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r SSHMobile-1.0.0-unsigned.ipa Payload
          echo "Created SSHMobile-1.0.0-unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHMobile-1.0.0-unsigned-ipa
          path: SSHMobile-1.0.0-unsigned.ipa
          retention-days: 14
