name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Trust Xcode Macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Remove duplicate SSHMobile subfolder
        run: |
          if [ -d "SSHMobile" ]; then
            echo "Removing duplicate SSHMobile folder"
            rm -rf SSHMobile
          fi
          ls -la

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Archive
        run: |
          PROJ=$(find . -name "*.xcodeproj" | head -n 1)
          xcodebuild archive \
            -project "$PROJ" \
            -scheme SSHMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/SSHMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP=$(find ./build/SSHMobile.xcarchive/Products -name "*.app" | head -n 1)
          mkdir -p ./build/Payload
          cp -r "$APP" ./build/Payload/SSHMobile.app
          cd ./build && zip -r SSHMobile-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SSHMobile-1.0.0-unsigned-ipa
          path: ./build/SSHMobile-unsigned.ipa
          retention-days: 30
